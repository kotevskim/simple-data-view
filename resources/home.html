<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - {{APP_NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #fff; padding: 1rem 2rem; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.3rem; }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .header-actions a, .header-actions button { text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; border: 1px solid #ccc; background: #fff; color: #333; }
    .header-actions a:hover, .header-actions button:hover { background: #f0f0f0; }
    .btn-primary { background: #2563eb !important; color: #fff !important; border-color: #2563eb !important; }
    .btn-primary:hover { background: #1d4ed8 !important; }
    .btn-danger { color: #dc2626 !important; border-color: #dc2626 !important; }
    .btn-danger:hover { background: #fef2f2 !important; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .query-list { list-style: none; }
    .query-item { background: #fff; padding: 0.8rem 1rem; margin-bottom: 0.5rem; border-radius: 6px; border: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
    .query-item a { color: #2563eb; text-decoration: none; font-weight: 500; }
    .query-item a:hover { text-decoration: underline; }
    .query-actions { display: flex; gap: 0.4rem; align-items: center; }
    .query-actions a, .query-actions button { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0.2rem 0.4rem; border-radius: 3px; text-decoration: none; color: #555; }
    .query-actions a:hover, .query-actions button:hover { background: #f0f0f0; }
    .query-actions .delete-btn { color: #dc2626; }
    .query-actions .refresh-btn { color: #16a34a; }
    .empty { text-align: center; color: #888; padding: 3rem 0; }
    .cache-badge { font-size: 0.7rem; background: #dbeafe; color: #1e40af; padding: 0.15rem 0.4rem; border-radius: 3px; margin-left: 0.5rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>{{APP_NAME}}</h1>
    <div class="header-actions">
      {{ADMIN_BUTTONS}}
      <form method="POST" action="/logout" style="margin:0;">
        <button type="submit">Logout</button>
      </form>
    </div>
  </div>
  <div class="container">
    {{QUERY_LIST}}
  </div>
</body>
</html>
