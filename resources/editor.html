<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{QUERY_NAME}} - {{APP_NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #fff; padding: 1rem 2rem; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; }
    .header a { text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.85rem; border: 1px solid #ccc; background: #fff; color: #333; }
    .header a:hover { background: #f0f0f0; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 300px; font-family: "SF Mono", "Fira Code", monospace; font-size: 0.9rem; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
    .form-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
    .form-actions button { padding: 0.5rem 1.2rem; border-radius: 4px; font-size: 0.9rem; cursor: pointer; border: none; }
    .btn-save { background: #2563eb; color: #fff; }
    .btn-save:hover { background: #1d4ed8; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    .cache-section { margin-top: 1.5rem; padding: 1rem; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; }
    .cache-section h3 { font-size: 1rem; margin-bottom: 0.8rem; }
    .cache-row { display: flex; gap: 1rem; align-items: center; }
    .cache-row label { margin: 0; font-weight: normal; }
    .cache-row input[type="number"] { width: 100px; padding: 0.3rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Edit: {{QUERY_NAME}}</h1>
    <a href="/">Back to Home</a>
  </div>
  <div class="container">
    <form method="POST" action="/admin/edit/{{QUERY_NAME}}">
      <label for="name">Query Name</label>
      <input type="text" id="name" name="name" value="{{QUERY_NAME}}" required pattern="[a-zA-Z0-9_-]+" style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;font-size:0.95rem;margin-bottom:1rem;">
      <label for="sql">SQL Query</label>
      <textarea id="sql" name="sql">{{SQL_CONTENT}}</textarea>
      <div class="cache-section">
        <h3>Cache Settings</h3>
        <div class="cache-row">
          <label><input type="checkbox" name="cache_enabled" {{CACHE_ENABLED}}> Enable caching</label>
          <label>Interval (seconds): <input type="number" name="cache_interval" value="{{CACHE_INTERVAL}}" min="1"></label>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-save">Save</button>
      </div>
    </form>
  </div>
</body>
</html>
