<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Query - Simple Data View</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #fff; padding: 1rem 2rem; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; }
    .header a { text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.85rem; border: 1px solid #ccc; background: #fff; color: #333; }
    .header a:hover { background: #f0f0f0; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    input[type="text"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; margin-bottom: 1rem; }
    textarea { width: 100%; min-height: 300px; font-family: "SF Mono", "Fira Code", monospace; font-size: 0.9rem; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
    .form-actions { margin-top: 1rem; }
    .form-actions button { padding: 0.5rem 1.2rem; border-radius: 4px; font-size: 0.9rem; cursor: pointer; border: none; background: #2563eb; color: #fff; }
    .form-actions button:hover { background: #1d4ed8; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <h1>New Query</h1>
    <a href="/">Back to Home</a>
  </div>
  <div class="container">
    <form method="POST" action="/admin/new">
      <label for="name">Query Name</label>
      <input type="text" id="name" name="name" required placeholder="e.g. active_users" pattern="[a-zA-Z0-9_-]+">
      <label for="sql">SQL Query</label>
      <textarea id="sql" name="sql" required placeholder="SELECT ..."></textarea>
      <div class="form-actions">
        <button type="submit">Create Query</button>
      </div>
    </form>
  </div>
</body>
</html>
